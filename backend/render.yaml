services:
  - type: web
    name: arribot-backend
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/arribot-backend-1.0.0.jar
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        value: placeholder
